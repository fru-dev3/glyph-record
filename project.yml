# Glyph Record for Mac. Generate the Xcode project with `xcodegen generate`.
name: GlyphRecord
options:
  bundleIdPrefix: dev.fru
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
packages:
  GlyphCore:
    path: Packages/GlyphCore
targets:
  GlyphRecord: # Glyph Record: records meetings and calls on the Mac, keeps a library. Independent: links GlyphCore only.
    type: application
    platform: macOS
    sources:
      - path: Record
    dependencies:
      - package: GlyphCore
        product: GlyphCore
    entitlements:
      path: Record/GlyphRecord.entitlements
      properties:
        com.apple.security.device.audio-input: true
    scheme:
      testTargets: [GlyphRecordTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fru.glyph.record
        PRODUCT_NAME: Glyph Record
        PRODUCT_MODULE_NAME: GlyphRecord
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Record/Info.plist
      properties:
        CFBundleDisplayName: Glyph Record
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Glyph Record hears your side of the conversation through the microphone. Everything stays on this Mac.
        NSScreenCaptureUsageDescription: Glyph Record records the Mac's own sound, so the other side of a call is in the recording too. Nothing is shared.
        NSAudioCaptureUsageDescription: Glyph Record records the Mac's own sound, so the other side of a call is in the recording too. Nothing is shared.
  GlyphRecordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RecordTests
        excludes: ["*.py"]
    dependencies:
      - target: GlyphRecord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fru.glyph.record.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Glyph Record.app/Contents/MacOS/Glyph Record
        BUNDLE_LOADER: $(TEST_HOST)
